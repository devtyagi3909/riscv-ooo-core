<?xml version='1.0' encoding='utf-8'?>
<svg width="1150" height="750" xmlns="http://www.w3.org/2000/svg" style="background-color: #030303; font-family: 'Space Mono', 'Courier New', monospace;"><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#111111" stroke_width="1" /></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" /><style>
        .wire { stroke: #333; stroke-width: 2; fill: none; }
        .wire-active { stroke: #ff4500; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
        .wire-bus { stroke: #0088ff; stroke-width: 3; fill: none; stroke-dasharray: 8 8; animation: flow-bus 0.8s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -12; } }
        @keyframes flow-bus { to { stroke-dashoffset: -16; } }
        
        .box { fill: #0a0a0a; stroke: #333; stroke-width: 2; rx: 4; }
        .box-highlight { fill: #111; stroke: #ff4500; stroke-width: 2; rx: 4; }
        .box-blue { fill: #111; stroke: #0088ff; stroke-width: 2; rx: 4; }
        
        .text { fill: #999; font-size: 13px; font-weight: bold; }
        .text-hl { fill: #fff; font-size: 13px; font-weight: bold; }
        
        /* Blinking logic for execution */
        .exec-flash { animation: exec 1.5s infinite; }
        @keyframes exec { 
            0%, 20% { fill: #111; stroke: #333; }
            25%, 75% { fill: #3a1000; stroke: #ff4500; }
            80%, 100% { fill: #111; stroke: #333; }
        }
        
        .rob-fill { animation: robf 3s infinite; }
        @keyframes robf {
            0% { fill: #111; }
            20% { fill: #00aa00; }
            80% { fill: #00aa00; }
            100% { fill: #111; }
        }
        
        /* Moving packets */
        .packet-green { fill: #00ff00; filter: url(#glow); }
        .packet-red { fill: #ff4500; filter: url(#glow); }
        .packet-blue { fill: #0088ff; filter: url(#glow); }
    </style><path d="M 180 120 L 180 170.0 L 280 170.0 L 280 220" class="wire" /><path d="M 180 240 L 230.0 240 L 230.0 220 L 280 220" class="wire" /><path d="M 420 220 L 520 140" class="wire-active" /><path d="M 420 220 L 520 320" class="wire-active" /><path d="M 660 140 L 740 140" class="wire-active" /><path d="M 660 300 L 740 260" class="wire-active" /><path d="M 660 340 L 740 380" class="wire-active" /><path d="M 860 260 L 860 380.0 L 900 380.0 L 900 500" class="wire-bus" /><path d="M 860 380 L 860 440.0 L 900 440.0 L 900 500" class="wire-bus" /><path d="M 440 500 L 960 500" class="wire-bus" /><path d="M 940 500 L 940 420.0 L 980 420.0 L 980 340" class="wire-bus" /><path d="M 460 500 L 460 420.0 L 520 420.0 L 520 340" class="wire-bus" /><path d="M 480 500 L 480 330.0 L 520 330.0 L 520 160" class="wire-bus" /><rect x="40" y="100" width="140" height="40" class="box" /><text x="110.0" y="124.0" text_anchor="middle" class="text">PC / BPU</text><rect x="40" y="220" width="140" height="40" class="box" /><text x="110.0" y="244.0" text_anchor="middle" class="text">I-Cache</text><rect x="280" y="160" width="140" height="120" class="box" /><text x="350.0" y="224.0" text_anchor="middle" class="text">2-Wide Decode</text><rect x="520" y="100" width="140" height="80" class="box-highlight" /><text x="590.0" y="137.0" text_anchor="middle" class="text-hl">RAT</text><text x="590.0" y="153.0" text_anchor="middle" class="text-hl">(Rename)</text><rect x="520" y="280" width="140" height="80" class="box-highlight" /><text x="590.0" y="317.0" text_anchor="middle" class="text-hl">Issue Queue</text><text x="590.0" y="333.0" text_anchor="middle" class="text-hl">(Scoreboard)</text><rect x="740" y="120" width="120" height="40" class="box-blue" /><text x="800.0" y="144.0" text_anchor="middle" class="text-hl">Physical Regs</text><rect x="740" y="240" width="120" height="40" class="box exec-flash" /><text x="800.0" y="264.0" text_anchor="middle" class="text-hl">ALU 0</text><rect x="740" y="360" width="120" height="40" class="box exec-flash" /><text x="800.0" y="384.0" text_anchor="middle" class="text-hl">ALU 1</text><rect x="980" y="120" width="120" height="300" class="box" /><text x="1040.0" y="267.0" text_anchor="middle" class="text">Reorder Buffer</text><text x="1040.0" y="283.0" text_anchor="middle" class="text">(ROB)</text><rect x="1000" y="170" width="80" height="16" fill="#111" rx="2" /><rect x="1000" y="192" width="80" height="16" fill="#111" rx="2" /><rect x="1000" y="214" width="80" height="16" fill="#111" rx="2" /><rect x="1000" y="236" width="80" height="16" fill="#111" rx="2" /><rect x="1000" y="258" width="80" height="16" fill="#111" rx="2" class="rob-fill" style="animation-delay: 0.8s" /><rect x="1000" y="280" width="80" height="16" fill="#111" rx="2" class="rob-fill" style="animation-delay: 1.0s" /><rect x="1000" y="302" width="80" height="16" fill="#111" rx="2" class="rob-fill" style="animation-delay: 1.2000000000000002s" /><rect x="1000" y="324" width="80" height="16" fill="#111" rx="2" class="rob-fill" style="animation-delay: 1.4000000000000001s" /><rect x="1000" y="346" width="80" height="16" fill="#111" rx="2" /><rect x="1000" y="368" width="80" height="16" fill="#111" rx="2" /><circle r="5" class="packet-green"><animateMotion path="M 110 140 L 110 220" dur="1.2s" repeatCount="indefinite" /></circle><circle r="5" class="packet-green"><animateMotion path="M 180 240 L 280 220" dur="1.2s" repeatCount="indefinite" /></circle><circle r="5" class="packet-red"><animateMotion path="M 420 220 L 520 320" dur="1s" repeatCount="indefinite" /></circle><circle r="5" class="packet-red"><animateMotion path="M 660 300 L 740 260" dur="0.8s" repeatCount="indefinite" /></circle><circle r="5" class="packet-blue"><animateMotion path="M 860 380 L 900 380 L 900 500" dur="1s" repeatCount="indefinite" /></circle><circle r="5" class="packet-blue"><animateMotion path="M 900 500 L 940 500 L 940 340 L 980 340" dur="1.2s" repeatCount="indefinite" /></circle><circle r="5" class="packet-blue"><animateMotion path="M 520 500 L 460 500 L 460 340 L 520 340" dur="1.2s" repeatCount="indefinite" /></circle><rect x="40" y="560" width="380" height="160" fill="#0a0a0a" stroke="#444" stroke_width="2" rx="4" /><text x="230" y="585" fill="#fff" font_size="14" font_weight="bold" text_anchor="middle">[ DIAGRAM LEGEND ]</text><circle cx="70" cy="615" r="5" class="packet-green" /><text x="90" y="619" fill="#aaa" font_size="12" font_weight="bold">In-Order Instruction Fetch / Decode</text><circle cx="70" cy="640" r="5" class="packet-red" /><text x="90" y="644" fill="#aaa" font_size="12" font_weight="bold">Out-of-Order Micro-Op Dispatch</text><circle cx="70" cy="665" r="5" class="packet-blue" /><text x="90" y="669" fill="#aaa" font_size="12" font_weight="bold">CDB Result Broadcast / Wakeup</text><rect x="60" y="680" width="20" height="20" rx="2" class="box exec-flash" /><text x="90" y="694" fill="#aaa" font_size="12" font_weight="bold">Active Execution Unit (Crunching)</text><rect x="60" y="707" width="20" height="16" rx="2" class="rob-fill" /><text x="90" y="719" fill="#aaa" font_size="12" font_weight="bold">ROB Entry Allocation &amp; Commit</text><text x="40" y="40" fill="#fff" font_size="18" font_weight="bold">[ RISC-V OOO CORE WORKING PIPELINE ]</text></svg>