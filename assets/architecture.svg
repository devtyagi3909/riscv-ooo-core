<svg width="1150" height="650" xmlns="http://www.w3.org/2000/svg" style="background-color: #09090b; font-family: 'Courier New', Courier, monospace;"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b" /></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc3d10" /></marker></defs><style>
