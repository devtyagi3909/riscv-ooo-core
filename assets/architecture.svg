<?xml version='1.0' encoding='utf-8'?>
<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg" style="background-color: #000000; font-family: 'Space Mono', 'Courier New', monospace;"><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke_width="1" /></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" /><style>
        .wire { stroke: #333; stroke-width: 2; fill: none; }
        .wire-active { stroke: #ff4500; stroke-width: 2; fill: none; stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
        .wire-bus { stroke: #0088ff; stroke-width: 3; fill: none; stroke-dasharray: 6 6; animation: flow-bus 0.5s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -8; } }
        @keyframes flow-bus { to { stroke-dashoffset: -12; } }
        
        .box { fill: #0a0a0a; stroke: #444; stroke-width: 1.5; rx: 4; }
        .box-highlight { fill: #111; stroke: #ff4500; stroke-width: 2; rx: 4; }
        .box-blue { fill: #111; stroke: #0088ff; stroke-width: 2; rx: 4; }
        
        .text { fill: #888; font-size: 12px; font-weight: bold; }
        .text-hl { fill: #fff; font-size: 12px; font-weight: bold; }
        
        /* Blinking logic for execution */
        .exec-flash { animation: exec 2s infinite; }
        @keyframes exec { 
            0%, 40% { fill: #111; }
            45%, 55% { fill: #331000; }
            60%, 100% { fill: #111; }
        }
        
        /* Moving packets */
        .packet { fill: #00ff00; filter: url(#glow); }
        .packet-red { fill: #ff4500; filter: url(#glow); }
    </style><path d="M 180 100 L 180 150.0 L 260 150.0 L 260 200" class="wire-active" /><path d="M 180 200 L 220.0 200 L 220.0 200 L 260 200" class="wire-active" /><path d="M 400 200 L 480 120" class="wire-active" /><path d="M 400 200 L 480 280" class="wire-active" /><path d="M 620 120 L 700 120" class="wire-active" /><path d="M 620 260 L 700 220" class="wire-active" /><path d="M 620 300 L 700 340" class="wire-active" /><path d="M 820 220 L 820 330.0 L 880 330.0 L 880 440" class="wire-bus" /><path d="M 820 340 L 820 390.0 L 880 390.0 L 880 440" class="wire-bus" /><path d="M 880 460 L 880 490.0 L 260 490.0 L 260 520" class="wire-bus" /><path d="M 260 520 L 480 520" class="wire-bus" /><path d="M 480 520 L 480 320" class="wire-bus" /><path d="M 480 520 L 480 160" class="wire-bus" /><path d="M 880 440 L 910.0 440 L 910.0 280 L 940 280" class="wire-bus" /><rect x="40" y="80" width="140" height="40" class="box" /><text x="110.0" y="104.0" text_anchor="middle" class="text">PC / BPU</text><rect x="40" y="180" width="140" height="40" class="box" /><text x="110.0" y="204.0" text_anchor="middle" class="text">I-Cache</text><rect x="260" y="140" width="140" height="120" class="box" /><text x="330.0" y="204.0" text_anchor="middle" class="text">2-Wide Decode</text><rect x="480" y="80" width="140" height="80" class="box-highlight" /><text x="550.0" y="118.0" text_anchor="middle" class="text-hl">RAT</text><text x="550.0" y="132.0" text_anchor="middle" class="text-hl">(Rename)</text><rect x="480" y="240" width="140" height="80" class="box-highlight" /><text x="550.0" y="278.0" text_anchor="middle" class="text-hl">Issue Queue</text><text x="550.0" y="292.0" text_anchor="middle" class="text-hl">(Scoreboard)</text><rect x="700" y="80" width="120" height="80" class="box-blue" /><text x="760.0" y="124.0" text_anchor="middle" class="text-hl">Physical Regs</text><rect x="700" y="200" width="120" height="40" class="box exec-flash" /><text x="760.0" y="224.0" text_anchor="middle" class="text-hl">ALU 0</text><rect x="700" y="320" width="120" height="40" class="box exec-flash" /><text x="760.0" y="344.0" text_anchor="middle" class="text-hl">ALU 1</text><rect x="820" y="420" width="120" height="40" class="box-blue" /><text x="880.0" y="444.0" text_anchor="middle" class="text-hl">Common Data Bus</text><rect x="900" y="100" width="80" height="300" class="box" /><text x="940.0" y="254.0" text_anchor="middle" class="text">ROB</text><rect x="910" y="130" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="150" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="170" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="190" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="210" width="60" height="16" fill="#00ff00" rx="2" opacity="0.7" /><rect x="910" y="230" width="60" height="16" fill="#00ff00" rx="2" opacity="0.7" /><rect x="910" y="250" width="60" height="16" fill="#00ff00" rx="2" opacity="0.7" /><rect x="910" y="270" width="60" height="16" fill="#00ff00" rx="2" opacity="0.7" /><rect x="910" y="290" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="310" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="330" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><rect x="910" y="350" width="60" height="16" fill="#111" rx="2" opacity="0.7" /><circle r="4" class="packet"><animateMotion path="M 110 120 L 110 180" dur="1s" repeatCount="indefinite" /></circle><circle r="4" class="packet"><animateMotion path="M 180 200 L 260 200" dur="1s" repeatCount="indefinite" /></circle><circle r="4" class="packet"><animateMotion path="M 400 200 L 480 280" dur="1.2s" repeatCount="indefinite" /></circle><circle r="4" class="packet-red"><animateMotion path="M 620 260 L 700 220" dur="0.8s" repeatCount="indefinite" /></circle><circle r="4" fill="#0088ff"><animateMotion path="M 820 220 L 820 440 L 880 440" dur="1.5s" repeatCount="indefinite" /></circle><circle r="4" fill="#0088ff"><animateMotion path="M 880 440 L 940 440 L 940 280" dur="1s" repeatCount="indefinite" /></circle><text x="20" y="30" fill="#fff" font_size="16" font_weight="bold">[ RISC-V OOO CORE WORKING PIPELINE ]</text></svg>