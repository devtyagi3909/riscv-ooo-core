" font_size="14" font_weight="bold" text_anchor="middle">In-Order Commit</text><text x="1060.0" y="320.0" fill="#000" font_size="14" font_weight="bold" text_anchor="middle">Precise Exceptions</text><text x="1060.0" y="338.0" fill="#000" font_size="14" font_weight="bold" text_anchor="middle">Branch Recovery</text><text x="1060.0" y="356.0" fill="#000" font_size="14" font_weight="bold" text_anchor="middle" /><text x="1060.0" y="374.0" fill="#000" font_size="14" font_weight="bold" text_anchor="middle">(Active Development)</text></g><path d="M 480 200 L 480 60" stroke="#333" stroke_width="2" fill="none" class="data-flow" /><path d="M 480 60 L 1060 60" stroke="#333" stroke_width="2" fill="none" class="data-flow" /><path d="M 1060 60 L 1060 160" stroke="#333" stroke_width="2" fill="none" marker-end="url(#arrow)" class="data-flow" /><path d="M 1060 540 L 1060 460" stroke="#1a73e8" stroke_width="2" fill="none" marker-end="url(#arrow-blue)" class="bus-pulse" /><path d="M 1060 160 L 1060 80" stroke="#333" stroke_width="2" fill="none" stroke-dasharray="5,5" class="data-flow" /><path d="M 1060 80 L 440 80" stroke="#333" stroke_width="2" fill="none" stroke-dasharray="5,5" class="data-flow" /><path d="M 440 80 L 440 100" stroke="#333" stroke_width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5" class="data-flow" /><path d="M 700 250 L 220 250" stroke="#d32f2f" stroke_width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="5,5" class="data-flow" /><text x="620" y="240" fill="#d32f2f" font_size="13" font_weight="bold">Branch Mispredict Flush</text></svg>